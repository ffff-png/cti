global:
  scrape_interval: 5s

scrape_configs:
  - job_name: orchestrator
    static_configs: [{ targets: ["host.docker.internal:8001"] }]
  - job_name: normalizer
    static_configs: [{ targets: ["host.docker.internal:8002"] }]
  - job_name: deduplicator
    static_configs: [{ targets: ["host.docker.internal:8003"] }]
